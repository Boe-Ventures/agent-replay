name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.6 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run build
      - run: bun run --cwd extension build
      - run: bun run --cwd extension zip
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish GitHub release and evidence bundle
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes \
            extension/.output/*.zip \
            site/public/artifacts/bugboard-broken.areplay \
            site/public/artifacts/agent-replay-demo.mp4 \
            site/public/artifacts/viewer.jpg \
            site/public/artifacts/storyboard.jpg \
            site/public/artifacts/fix-receipt.* \
            site/public/artifacts/local-model-inspection.md
        env:
          GH_TOKEN: ${{ github.token }}
